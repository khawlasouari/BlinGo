plugins {
    alias(libs.plugins.androidApplication)


}

android {
    namespace 'com.example.myapplication'
    compileSdk 34
    viewBinding {
        enabled = true
    }

    dataBinding {
        enabled = true
    }
    defaultConfig {
        applicationId "com.example.myapplication"
        minSdk 26

        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.camera.view

    // Retrofit pour les requêtes HTTP
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // TensorFlow Lite (Vision et reconnaissance faciale)
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
    implementation 'org.tensorflow:tensorflow-lite-task-vision:0.4.4'
    implementation 'org.tensorflow:tensorflow-lite:2.9.0'


    // CameraX (Prévisualisation de la caméra)
    implementation "androidx.camera:camera-core:1.3.0-alpha04"
    implementation 'androidx.camera:camera-camera2:1.3.0'
    implementation 'androidx.camera:camera-lifecycle:1.3.0'
    implementation 'androidx.camera:camera-view:1.3.0'
    implementation 'androidx.camera:camera-extensions:1.3.0'

    // Animation Lottie (Splash Screen)
    implementation "com.airbnb.android:lottie:4.2.2"

    // ML Kit (Détection de visages et reconnaissance de texte)
    implementation 'com.google.mlkit:face-detection:16.1.5'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:vision-common:16.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-face-detection:17.0.1'

    // GSON (Conversion JSON)
    implementation 'com.google.code.gson:gson:2.8.9'

    // Android Libraries (Mises à jour)
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.5.1'
    implementation 'androidx.navigation:navigation-ui:2.5.1'

    // JUnit pour les tests
    testImplementation ("junit:junit:4.13.2")
    androidTestImplementation ("androidx.test.ext:junit:1.1.3")
    androidTestImplementation ("androidx.test.espresso:espresso-core:3.4.0")
    implementation ("com.google.firebase:firebase-database:20.2.2")
    // Lifecycle
    implementation ("androidx.lifecycle:lifecycle-runtime-ktx:2.3.1")
    implementation ("androidx.lifecycle:lifecycle-process:2.3.1")
    implementation ("com.google.firebase:firebase-firestore:24.4.5")
    // OCR - Google ML Kit
    implementation 'com.google.mlkit:text-recognition:16.0.1'

// Text To Speech
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'org.jetbrains:annotations:23.0.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'com.google.firebase:firebase-database:20.3.0'
    implementation 'com.google.firebase:firebase-auth:22.1.1'
    implementation 'com.google.firebase:firebase-messaging:23.3.1'
    implementation 'org.jitsi.react:jitsi-meet-sdk:6.2.2'
    implementation 'com.google.firebase:firebase-analytics:21.1.1'
    implementation 'com.google.firebase:firebase-firestore:24.4.0'
    implementation 'com.google.firebase:firebase-auth:21.1.0'
    implementation 'com.google.firebase:firebase-appcheck-playintegrity:16.0.0'  // Ajoute cette dépendance si tu utilises AppCheck.
    // Ajoute d'autres dépendances Firebase selon tes besoins

    implementation 'com.giphy.sdk:ui:2.1.17' // ou plus récent
    implementation 'com.github.MatrixFrog:android-scalablevideoview:v1.0.4-jitpack'
    implementation 'com.google.firebase:firebase-firestore:24.9.0'
    implementation 'com.google.firebase:firebase-analytics'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'org.tensorflow:tensorflow-lite:2.10.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.3.1'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.10.0'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.7.0' // or the latest version
    implementation 'androidx.databinding:databinding-runtime:7.0.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.10"
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.3.0'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.3.0'
    implementation 'org.tensorflow:tensorflow-lite-gpu-delegate-plugin:0.4.2'

}
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add("-Xlint:deprecation")
}
configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
    }
}